<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVISTA21</title>
<style>
body{margin:0;font-family:Arial;background:#eef2ff;color:#172033}
header{background:#2563eb;color:white;text-align:center;padding:15px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 3px 12px #0002}
button{background:#2563eb;color:white;border:0;padding:12px 18px;border-radius:9px;margin:5px;cursor:pointer}
input,textarea,select{width:100%;padding:11px;margin:7px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
.hidden{display:none}
.option{display:block;background:#f1f5f9;padding:13px;margin:8px 0;border-radius:8px}
#camera{width:100%;max-width:360px;border-radius:12px;background:#111}
#timer{font-size:22px;font-weight:bold;color:#dc2626}
.score{text-align:center;font-size:40px;font-weight:bold;color:#16a34a}
</style>
</head>

<body>

<header>
<h1>EVISTA21</h1>
<p>Ulangan SMP Kelas 7</p>
</header>

<main>

<div id="home" class="card">
<h2>Selamat Datang</h2>
<button onclick="show('student')">👨‍🎓 Mulai Ulangan</button>
<button onclick="show('adminLogin')">🔐 Admin</button>
</div>

<div id="student" class="card hidden">
<h2>Data Siswa</h2>
<input id="studentName" placeholder="Nama siswa">
<input id="studentClass" placeholder="Kelas, contoh: 7A">
<button onclick="startExam()">📷 Mulai Ulangan</button>
<button onclick="home()">Kembali</button>
</div>

<div id="adminLogin" class="card hidden">
<h2>🔐 Admin EVISTA21</h2>
<input id="password" type="password" placeholder="Password">
<button onclick="loginAdmin()">Masuk</button>
<button onclick="home()">Kembali</button>
</div>

<div id="admin" class="card hidden">
<h2>Panel Admin</h2>

<textarea id="q" placeholder="Tulis pertanyaan"></textarea>
<input id="A" placeholder="Pilihan A">
<input id="B" placeholder="Pilihan B">
<input id="C" placeholder="Pilihan C">
<input id="D" placeholder="Pilihan D">

<select id="correct">
<option value="A">Jawaban benar: A</option>
<option value="B">Jawaban benar: B</option>
<option value="C">Jawaban benar: C</option>
<option value="D">Jawaban benar: D</option>
</select>

<button onclick="addQuestion()">➕ Tambah Soal</button>

<h3>Daftar Soal</h3>
<div id="questionList"></div>

<button onclick="clearQuestions()">🗑️ Hapus Semua Soal</button>
<button onclick="home()">Keluar</button>
</div>

<div id="exam" class="card hidden">

<div style="display:flex;justify-content:space-between">
<div>
<b id="displayName"></b><br>
<span id="displayClass"></span>
</div>
<div id="timer">30:00</div>
</div>

<hr>

<h3>📷 Kamera Ujian</h3>
<video id="camera" autoplay muted playsinline></video>

<div id="questionArea"></div>

<button onclick="nextQuestion()">Lanjut ➡️</button>

</div>

<div id="result" class="card hidden">
<h2>🎉 Ulangan Selesai</h2>
<div id="score" class="score"></div>
<p id="resultInfo"></p>
<button onclick="home()">Kembali</button>
</div>

</main>

<script>

let questions=JSON.parse(localStorage.getItem("evistaQuestions"))||[
{
q:"Berapakah hasil dari 2 + 3?",
A:"4",B:"5",C:"6",D:"7",correct:"B"
},
{
q:"Planet tempat manusia tinggal adalah?",
A:"Mars",B:"Venus",C:"Bumi",D:"Jupiter",correct:"C"
}
];

let current=0;
let answers=[];
let timer=null;
let timeLeft=1800;
let cameraStream=null;

function show(id){
document.querySelectorAll(".card").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function home(){
stopCamera();
clearInterval(timer);
show("home");
}

function loginAdmin(){
if(document.getElementById("password").value==="admin123"){
show("admin");
showQuestions();
}else{
alert("Password salah.");
}
}

function addQuestion(){

let q=document.getElementById("q").value.trim();
let A=document.getElementById("A").value.trim();
let B=document.getElementById("B").value.trim();
let C=document.getElementById("C").value.trim();
let D=document.getElementById("D").value.trim();
let correct=document.getElementById("correct").value;

if(!q||!A||!B||!C||!D){
alert("Lengkapi semua bagian soal.");
return;
}

questions.push({q,A,B,C,D,correct});

localStorage.setItem(
"evistaQuestions",
JSON.stringify(questions)
);

document.getElementById("q").value="";
document.getElementById("A").value="";
document.getElementById("B").value="";
document.getElementById("C").value="";
document.getElementById("D").value="";

showQuestions();

alert("Soal berhasil ditambahkan.");
}

function showQuestions(){

let list=document.getElementById("questionList");
list.innerHTML="";

questions.forEach((x,i)=>{
list.innerHTML+=`
<div style="border-bottom:1px solid #ddd;padding:10px">
<b>${i+1}. ${x.q}</b><br>
A. ${x.A}<br>
B. ${x.B}<br>
C. ${x.C}<br>
D. ${x.D}<br>
<small>Jawaban: ${x.correct}</small>
</div>`;
});
}

function clearQuestions(){

if(confirm("Hapus semua soal?")){
questions=[];
localStorage.setItem("evistaQuestions",JSON.stringify(questions));
showQuestions();
}
}

async function startExam(){

let name=document.getElementById("studentName").value.trim();
let kelas=document.getElementById("studentClass").value.trim();

if(!name||!kelas){
alert("Nama dan kelas harus diisi.");
return;
}

if(questions.length===0){
alert("Belum ada soal.");
return;
}

if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
alert("Browser tidak mendukung kamera.");
return;
}

try{

cameraStream=await navigator.mediaDevices.getUserMedia({
video:{
width:{ideal:1280},
height:{ideal:720},
facingMode:"user"
},
audio:false
});

let video=document.getElementById("camera");

video.srcObject=cameraStream;

video.onloadedmetadata=function(){
video.play();
};

}catch(error){

console.log(error);

alert(
"Kamera belum bisa digunakan. Pastikan kamera sudah diizinkan di Chrome."
);

return;
}

document.getElementById("displayName").textContent=name;
document.getElementById("displayClass").textContent="Kelas "+kelas;

current=0;
answers=[];
timeLeft=1800;

show("exam");
showQuestion();
startTimer();
}

function showQuestion(){

let x=questions[current];

document.getElementById("questionArea").innerHTML=`

<p><b>Soal ${current+1} dari ${questions.length}</b></p>

<h3>${x.q}</h3>

<label class="option">
<input type="radio" name="answer" value="A"> A. ${x.A}
</label>

<label class="option">
<input type="radio" name="answer" value="B"> B. ${x.B}
</label>

<label class="option">
<input type="radio" name="answer" value="C"> C. ${x.C}
</label>

<label class="option">
<input type="radio" name="answer" value="D"> D. ${x.D}
</label>

`;
}

function nextQuestion(){

let selected=document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){
alert("Pilih jawaban terlebih dahulu.");
return;
}

answers[current]=selected.value;

if(current<questions.length-1){
current++;
showQuestion();
}else{
finishExam();
}
}

function startTimer(){

clearInterval(timer);

timer=setInterval(function(){

timeLeft--;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").textContent=
String(min).padStart(2,"0")+":"+
String(sec).padStart(2,"0");

if(timeLeft<=0){
finishExam();
}

},1000);
}

function finishExam(){

clearInterval(timer);

let benar=0;

questions.forEach(function(x,i){
if(answers[i]===x.correct){
benar++;
}
});

let nilai=Math.round(
(benar/questions.length)*100
);

stopCamera();

show("result");

document.getElementById("score").textContent=nilai;

document.getElementById("resultInfo").textContent=
"Jawaban benar "+benar+
" dari "+questions.length+" soal.";
}

function stopCamera(){

if(cameraStream){

cameraStream.getTracks().forEach(
track=>track.stop()
);

cameraStream=null;
}
}

</script>

</body>
</html>
