<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVISTA21</title>

<style>
body{margin:0;font-family:Arial;background:#eef2ff;color:#172033}
header{background:#2563eb;color:white;text-align:center;padding:15px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 3px 12px #0002}
button{background:#2563eb;color:white;border:0;padding:12px 18px;border-radius:9px;margin:5px;cursor:pointer}
button:hover{background:#1d4ed8}
input,textarea,select{width:100%;padding:11px;margin:7px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
.hidden{display:none}
.option{display:block;background:#f1f5f9;padding:13px;margin:8px 0;border-radius:8px}
#camera{width:100%;max-width:360px;border-radius:12px;background:#111}
#timer{font-size:22px;font-weight:bold;color:#dc2626}
.score{text-align:center;font-size:40px;font-weight:bold;color:#16a34a}
.danger{background:#dc2626}
.small{color:#64748b;font-size:13px}
hr{border:0;border-top:1px solid #ddd;margin:20px 0}
</style>
</head>

<body>

<header>
<h1>EVISTA21</h1>
<p>Ulangan SMP Kelas 7</p>
</header>

<main>

<div id="home" class="card">
<h2>Selamat Datang</h2>
<button onclick="show('student')">👨‍🎓 Mulai Ulangan</button>
<button onclick="show('adminLogin')">🔐 Admin</button>
</div>

<div id="student" class="card hidden">
<h2>👨‍🎓 Data Peserta</h2>
<input id="studentName" placeholder="Nama siswa">
<input id="studentClass" placeholder="Kelas, contoh: 7A">
<button onclick="startExam()">📷 Mulai Ulangan</button>
<button onclick="home()">Kembali</button>
</div>

<div id="adminLogin" class="card hidden">
<h2>🔐 Admin EVISTA21</h2>
<input id="adminEmail" type="email" placeholder="Email admin">
<input id="adminPassword" type="password" placeholder="Password admin">
<button onclick="loginAdmin()">Masuk</button>
<button onclick="home()">Kembali</button>
</div>

<div id="admin" class="card hidden">

<h2>🔐 Panel Admin</h2>

<button onclick="showQuestions()">📝 Soal</button>
<button onclick="showScores()">📊 Nilai Siswa</button>

<hr>

<div id="questionPanel">

<h3>Tambah Soal</h3>

<textarea id="q" placeholder="Tulis pertanyaan"></textarea>
<input id="A" placeholder="Pilihan A">
<input id="B" placeholder="Pilihan B">
<input id="C" placeholder="Pilihan C">
<input id="D" placeholder="Pilihan D">

<select id="correct">
<option value="A">Jawaban benar: A</option>
<option value="B">Jawaban benar: B</option>
<option value="C">Jawaban benar: C</option>
<option value="D">Jawaban benar: D</option>
</select>

<button onclick="addQuestion()">➕ Tambah Soal</button>

<h3>Daftar Soal</h3>
<div id="questionList"></div>

<button class="danger" onclick="clearQuestions()">🗑️ Hapus Semua Soal</button>

</div>

<div id="scorePanel" class="hidden">

<h3>📊 Nilai Siswa</h3>

<div id="scoreList">
Memuat nilai...
</div>

</div>

<br>
<button onclick="logoutAdmin()">Keluar Admin</button>

</div>

<div id="exam" class="card hidden">

<div style="display:flex;justify-content:space-between;align-items:center">
<div>
<b id="displayName"></b><br>
<span id="displayClass"></span>
</div>

<div id="timer">30:00</div>
</div>

<hr>

<h3>📷 Kamera Ujian</h3>

<video id="camera" autoplay muted playsinline></video>

<p class="small">
Kamera aktif selama ulangan.
</p>

<div id="questionArea"></div>

<button onclick="nextQuestion()">Lanjut ➡️</button>

</div>

<div id="result" class="card hidden">

<h2>🎉 Ulangan Selesai</h2>

<div id="score" class="score"></div>

<p id="resultInfo"></p>

<button onclick="home()">Kembali ke Beranda</button>

</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyC8FvLGE-LvIaPRyM3CI-sE0VA4iL5jxM4",
authDomain:"evalista21.firebaseapp.com",
projectId:"evalista21",
storageBucket:"evalista21.firebasestorage.app",
messagingSenderId:"87074800914",
appId:"1:87074800914:web:be3ac1a371204c2e1a9fcb"

};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let questions=[];
let current=0;
let answers=[];
let timer=null;
let timeLeft=1800;
let cameraStream=null;


function show(id){

document
.querySelectorAll(".card")
.forEach(x=>x.classList.add("hidden"));

document
.getElementById(id)
.classList.remove("hidden");

}

window.show=show;


function home(){

stopCamera();
clearInterval(timer);
show("home");

}

window.home=home;


async function loadQuestions(){

try{

const snapshot=await getDocs(
collection(db,"questions")
);

questions=[];

snapshot.forEach(item=>{

questions.push({
id:item.id,
...item.data()
});

});

}catch(error){

console.error(error);

alert("Soal belum bisa dimuat.");

}

}


async function loginAdmin(){

const email=
document.getElementById("adminEmail").value.trim();

const password=
document.getElementById("adminPassword").value;

if(!email||!password){

alert("Isi email dan password.");

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

await loadQuestions();

show("admin");

showQuestions();

}catch(error){

console.error(error);

alert("Email atau password admin salah.");

}

}

window.loginAdmin=loginAdmin;


async function logoutAdmin(){

await signOut(auth);
home();

}

window.logoutAdmin=logoutAdmin;


async function addQuestion(){

const q=
document.getElementById("q").value.trim();

const A=
document.getElementById("A").value.trim();

const B=
document.getElementById("B").value.trim();

const C=
document.getElementById("C").value.trim();

const D=
document.getElementById("D").value.trim();

const correct=
document.getElementById("correct").value;


if(!q||!A||!B||!C||!D){

alert("Lengkapi semua bagian soal.");

return;

}


try{

await addDoc(
collection(db,"questions"),
{
q:q,
A:A,
B:B,
C:C,
D:D,
correct:correct
}
);

await loadQuestions();
showQuestions();

document.getElementById("q").value="";
document.getElementById("A").value="";
document.getElementById("B").value="";
document.getElementById("C").value="";
document.getElementById("D").value="";

alert("Soal berhasil disimpan.");

}catch(error){

console.error(error);

alert("Soal gagal disimpan.");

}

}

window.addQuestion=addQuestion;


function showQuestions(){

document
.getElementById("questionPanel")
.classList.remove("hidden");

document
.getElementById("scorePanel")
.classList.add("hidden");

const list=
document.getElementById("questionList");

list.innerHTML="";


if(questions.length===0){

list.innerHTML="<p>Belum ada soal.</p>";

return;

}


questions.forEach((x,i)=>{

list.innerHTML+=`

<div style="border-bottom:1px solid #ddd;padding:10px">

<b>${escapeHTML(x.q)}</b><br>

A. ${escapeHTML(x.A)}<br>
B. ${escapeHTML(x.B)}<br>
C. ${escapeHTML(x.C)}<br>
D. ${escapeHTML(x.D)}<br>

<small>Jawaban benar: ${x.correct}</small>

</div>

`;

});

}

window.showQuestions=showQuestions;


async function clearQuestions(){

if(!confirm("Yakin ingin menghapus semua soal?")){

return;

}

try{

const snapshot=
await getDocs(collection(db,"questions"));

for(const item of snapshot.docs){

await deleteDoc(
doc(db,"questions",item.id)
);

}

questions=[];

showQuestions();

alert("Semua soal sudah dihapus.");

}catch(error){

console.error(error);

alert("Soal gagal dihapus.");

}

}

window.clearQuestions=clearQuestions;


async function showScores(){

document
.getElementById("questionPanel")
.classList.add("hidden");

document
.getElementById("scorePanel")
.classList.remove("hidden");

const list=
document.getElementById("scoreList");

list.innerHTML="Memuat nilai...";


try{

const snapshot=
await getDocs(collection(db,"scores"));

if(snapshot.empty){

list.innerHTML="<p>Belum ada nilai siswa.</p>";

return;

}

let html="";

snapshot.forEach(item=>{

const x=item.data();

html+=`

<div style="border-bottom:1px solid #ddd;padding:12px">

<b>${escapeHTML(x.name)}</b><br>

Kelas: ${escapeHTML(x.className)}<br>

Nilai: <b>${x.score}</b><br>

Benar: ${x.correct} dari ${x.total} soal<br>

<small>${escapeHTML(x.date)}</small>

</div>

`;

});

list.innerHTML=html;

}catch(error){

console.error(error);

list.innerHTML="Nilai belum bisa dimuat.";

}

}

window.showScores=showScores;


async function startExam(){

const name=
document.getElementById("studentName")
.value.trim();

const kelas=
document.getElementById("studentClass")
.value.trim();


if(!name||!kelas){

alert("Nama dan kelas harus diisi.");

return;

}


/* LOGIN ANONIM DAHULU */

try{

await signInAnonymously(auth);

}catch(error){

console.error(error);

alert("Sistem siswa belum siap.");

return;

}


/* BARU AMBIL SOAL */

await loadQuestions();


if(questions.length===0){

alert("Belum ada soal.");

return;

}


/* KAMERA */

if(!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia){

alert("Browser tidak mendukung kamera.");

return;

}


try{

cameraStream=
await navigator.mediaDevices.getUserMedia({

video:{
width:{ideal:1280},
height:{ideal:720},
facingMode:"user"
},

audio:false

});


const video=
document.getElementById("camera");

video.srcObject=cameraStream;

await video.play();


}catch(error){

console.error(error);

alert(
"Kamera belum bisa digunakan. Pastikan izin kamera sudah diberikan."
);

return;

}


document
.getElementById("displayName")
.textContent=name;

document
.getElementById("displayClass")
.textContent="Kelas "+kelas;


current=0;
answers=[];
timeLeft=1800;


show("exam");

showQuestion();

startTimer();

}

window.startExam=startExam;


function showQuestion(){

const x=questions[current];

document
.getElementById("questionArea")
.innerHTML=`

<p>
<b>Soal ${current+1} dari ${questions.length}</b>
</p>

<h3>${escapeHTML(x.q)}</h3>

<label class="option">
<input type="radio" name="answer" value="A">
A. ${escapeHTML(x.A)}
</label>

<label class="option">
<input type="radio" name="answer" value="B">
B. ${escapeHTML(x.B)}
</label>

<label class="option">
<input type="radio" name="answer" value="C">
C. ${escapeHTML(x.C)}
</label>

<label class="option">
<input type="radio" name="answer" value="D">
D. ${escapeHTML(x.D)}
</label>

`;

}


function nextQuestion(){

const selected=
document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){

alert("Pilih jawaban terlebih dahulu.");

return;

}

answers[current]=selected.value;


if(current<questions.length-1){

current++;
showQuestion();

}else{

finishExam();

}

}

window.nextQuestion=nextQuestion;


function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

timeLeft--;

const min=Math.floor(timeLeft/60);
const sec=timeLeft%60;

document
.getElementById("timer")
.textContent=
String(min).padStart(2,"0")
+":"
+String(sec).padStart(2,"0");


if(timeLeft<=0){

clearInterval(timer);
finishExam();

}

},1000);

}


async function finishExam(){

clearInterval(timer);

let benar=0;

questions.forEach((x,i)=>{

if(answers[i]===x.correct){
benar++;
}

});


const nilai=
Math.round(
(benar/questions.length)*100
);


const name=
document
.getElementById("displayName")
.textContent;


const kelas=
document
.getElementById("displayClass")
.textContent
.replace("Kelas ","");


try{

await addDoc(
collection(db,"scores"),
{

name:name,
className:kelas,
score:nilai,
correct:benar,
total:questions.length,
date:new Date().toLocaleString("id-ID")

}
);

}catch(error){

console.error(error);

alert(
"Nilai selesai dihitung, tetapi belum berhasil disimpan."
);

}


stopCamera();

show("result");


document
.getElementById("score")
.textContent=nilai;


document
.getElementById("resultInfo")
.textContent=
"Jawaban benar "+
benar+
" dari "+
questions.length+
" soal.";

}


function stopCamera(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(track=>track.stop());

cameraStream=null;

}

}


function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


show("home");

</script>

</body>
</html>
